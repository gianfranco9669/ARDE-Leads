{% extends 'leadfinder/base.html' %}{% block content %}<h1 class="text-3xl font-black mb-6">Plantillas</h1><form method="post" class="rounded-2xl bg-white/5 border border-white/10 p-5 mb-6">{% csrf_token %}{{ form.as_p }}<p class="text-slate-400">Variables: {nombre}, {rubro}, {zona}, {direccion}, {servicio_ofrecido}</p><button class="bg-orange-500 rounded-xl px-4 py-2 font-bold">Guardar</button></form><div class="grid md:grid-cols-2 gap-4">{% for t in templates %}<div class="rounded-2xl bg-white/5 border border-white/10 p-5"><b>{{ t.name }}</b><p class="text-slate-300 whitespace-pre-wrap">{{ t.body }}</p></div>{% endfor %}</div><style>input,select,textarea{width:100%;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:.8rem}</style>{% endblock %}
