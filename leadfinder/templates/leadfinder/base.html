<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARDE Leads</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/htmx.org@1.9.12"></script><script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script></head><body class="bg-slate-950 text-slate-100"><div class="min-h-screen flex"><aside class="w-72 bg-slate-950 border-r border-white/10 p-5 hidden md:block"><div class="text-2xl font-black text-orange-400">ARDE Leads</div><p class="text-xs text-slate-400 mt-1">Prospección premium</p><nav class="mt-8 space-y-2"><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:dashboard' %}">Dashboard</a><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:search_new' %}">Nueva búsqueda</a><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:searches' %}">Historial</a><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:explorer' %}">Explorador</a><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:pipeline' %}">Pipeline</a><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:campaigns' %}">Campañas</a><a class="block px-4 py-3 rounded-xl hover:bg-white/10" href="{% url 'leadfinder:templates' %}">Plantillas</a></nav></aside><main class="flex-1"><header class="sticky top-0 z-20 bg-slate-900/80 backdrop-blur border-b border-white/10 px-6 py-4 flex gap-4 items-center"><input class="bg-slate-800 rounded-xl px-4 py-2 flex-1" placeholder="Buscar leads, zonas, rubros..."><a href="{% url 'leadfinder:search_new' %}" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold">Iniciar búsqueda</a></header><section class="p-6">{% for message in messages %}<div class="mb-4 rounded-xl bg-emerald-500/15 border border-emerald-400/30 p-3">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</section></main></div></body></html>
