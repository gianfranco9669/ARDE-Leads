{% load prospeccion_ui %}<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARDE Leads · Prospección</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/htmx.org@1.9.12"></script><script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script><style>:root{--fuego:#f97316;--borde:rgba(255,255,255,.10)}.superficie{background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.82));border:1px solid var(--borde);box-shadow:0 18px 60px rgba(0,0,0,.28)}.card{background:rgba(15,23,42,.64);border:1px solid var(--borde);border-radius:1.25rem}.chip{border:1px solid rgba(251,146,60,.32);background:rgba(249,115,22,.10);color:#fed7aa;border-radius:999px;padding:.36rem .68rem;font-size:.78rem;font-weight:700}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.24rem .55rem;font-size:.72rem;font-weight:800}.input{width:100%;border-radius:.9rem;border:1px solid var(--borde);background:rgba(2,6,23,.66);padding:.68rem .9rem;color:#f8fafc;outline:none}.input:focus{border-color:rgba(251,146,60,.75);box-shadow:0 0 0 3px rgba(249,115,22,.14)}.btn{border-radius:.9rem;padding:.62rem .9rem;font-weight:850;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,#f97316,#ef4444);color:#fff}.btn-secondary{background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid var(--borde)}.btn-danger{background:rgba(239,68,68,.16);color:#fecaca;border:1px solid rgba(239,68,68,.28)}.empty{border:1px dashed rgba(255,255,255,.16);border-radius:1.2rem;padding:1.4rem;text-align:center;color:#94a3b8}</style></head><body class="bg-[#080b12] text-slate-100"><div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_14%_0%,rgba(249,115,22,.18),transparent_30%),radial-gradient(circle_at_90%_8%,rgba(239,68,68,.10),transparent_26%)]"></div><div class="relative min-h-screen flex"><aside class="hidden lg:flex w-64 flex-col border-r border-white/10 bg-slate-950/88 p-4"><div class="rounded-2xl bg-gradient-to-br from-orange-500 to-red-600 p-4 shadow-lg shadow-orange-950/30"><div class="text-2xl font-black">ARDE</div><div class="text-xs font-bold text-orange-50">Leads · Prospección premium</div></div><nav class="mt-6 space-y-1 text-sm font-bold"><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:dashboard' %}">Centro de control</a><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:nueva_busqueda' %}">Nueva búsqueda</a><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:busquedas' %}">Historial</a><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:explorador' %}">Explorador</a><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:pipeline' %}">Pipeline</a><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:campanias' %}">Campañas</a><a class="block rounded-xl px-3 py-2.5 hover:bg-white/10" href="{% url 'prospeccion:plantillas' %}">Plantillas</a></nav><div class="mt-auto rounded-2xl border border-orange-400/20 bg-orange-500/10 p-3 text-xs text-orange-100">Contacto manual. Sin envíos masivos automáticos.</div></aside><main class="flex-1 min-w-0"><header class="sticky top-0 z-30 border-b border-white/10 bg-slate-950/72 backdrop-blur-xl px-4 py-3"><form method="get" action="{% url 'prospeccion:explorador' %}" class="flex gap-2"><input class="input" name="q" value="{{ request.GET.q }}" placeholder="Buscar prospectos, rubros, zonas, estados o campañas…"><button class="btn btn-primary" aria-label="Buscar">Buscar</button></form></header><section class="p-4 lg:p-6">{% for message in messages %}<div class="mb-4 rounded-2xl border border-emerald-400/20 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-100">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</section></main></div></body></html>
